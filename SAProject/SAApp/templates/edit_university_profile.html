{% extends 'base.html' %}
{% load static %}

{% block title %}Edit University Profile{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto py-8">
    <h1 class="text-3xl font-bold text-gray-900 mb-6 text-center">Edit University Profile</h1>
    <form method="post" enctype="multipart/form-data" class="bg-white shadow-md rounded-lg px-8 py-6">
        {% csrf_token %}
        <div class="mb-4">
            <label class="block text-gray-700 font-semibold mb-2">Name</label>
            <input type="text" name="name" value="{{ university.name }}" class="form-input mt-1 block w-full border-gray-300 rounded-md" required>
        </div>
        <div class="mb-4">
            <label class="block text-gray-700 font-semibold mb-2">Description</label>
            <textarea name="description" class="form-input mt-1 block w-full border-gray-300 rounded-md" rows="3">{{ university.description }}</textarea>
        </div>
        <div class="mb-4">
            <label class="block text-gray-700 font-semibold mb-2">Contact Email</label>
            <input type="email" name="contact_email" value="{{ university.contact_email }}" class="form-input mt-1 block w-full border-gray-300 rounded-md" required>
        </div>
        <div class="mb-6">
            <label class="block text-gray-700 font-semibold mb-2">Logo</label>
            {% if university.logo %}
                <img src="{{ university.logo.url }}" alt="Logo" class="h-20 mb-2">
            {% endif %}
            <input type="file" name="logo">
        </div>
        <div class="flex justify-center">
            <button type="submit" class="px-6 py-2 bg-primary text-white rounded-lg font-medium hover:bg-blue-600 transition-colors">Save Changes</button>
        </div>
    </form>
</div>
{% endblock %}
